<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<title>Bee Swarm Clicker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 64 64'%3E%3Cpath d='M32 2l26 15v30L32 62 6 47V17z' fill='%23f7b32b' stroke='%235b3a1a' stroke-width='4'/%3E%3Ccircle cx='32' cy='32' r='9' fill='%233a2410'/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@500;600;700;800&family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
:root{
  --sky1:#9ed8f5; --sky2:#dff3ff; --sky3:#eafaff;
  --grass:#7cb342; --grass2:#4e7a26;
  --honey:#f7b32b; --honey2:#ffd166; --honey3:#c98a10; --honey4:#8a5a08;
  --panel:#3b2711; --panel2:#4a3216; --panel3:#2c1c0b;
  --cream:#fff8e7; --cream2:#f6e8c8;
  --ink:#2c1a08; --ink2:#5b3a1a;
  --gold:#ffd166; --pink1:#ffc7e0; --pink2:#ff7fb2;
  --danger:#e5735f; --good:#9ccc65; --blue:#4fc3f7;
  --f-head:'Baloo 2', 'Trebuchet MS', system-ui, sans-serif;
  --f-body:'Nunito', 'Segoe UI', system-ui, sans-serif;
}
*{margin:0;padding:0;box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{height:100%}
body{
  font-family:var(--f-body); color:var(--cream);
  background:linear-gradient(180deg,var(--sky1) 0%,var(--sky2) 55%,var(--sky3) 100%);
  overflow:hidden; user-select:none; -webkit-user-select:none; touch-action:manipulation;
}
button{font-family:inherit;cursor:pointer}
::-webkit-scrollbar{width:10px;height:10px}
::-webkit-scrollbar-track{background:rgba(0,0,0,.22);border-radius:8px}
::-webkit-scrollbar-thumb{background:linear-gradient(180deg,var(--honey2),var(--honey3));border-radius:8px;border:2px solid rgba(0,0,0,.25)}

/* ---------- sky decorations ---------- */
#skyDeco{position:fixed;inset:0;z-index:0;pointer-events:none;overflow:hidden}
.cloud{position:absolute;background:rgba(255,255,255,.85);border-radius:60px;filter:blur(1px);opacity:.85;animation:cloudDrift linear infinite}
.cloud::before,.cloud::after{content:"";position:absolute;background:inherit;border-radius:50%}
.cloud::before{width:55%;height:160%;left:14%;top:-72%}
.cloud::after{width:38%;height:110%;right:12%;top:-42%}
@keyframes cloudDrift{from{transform:translateX(-30vw)}to{transform:translateX(115vw)}}
#hills{position:fixed;left:0;right:0;bottom:0;height:24vh;z-index:0;pointer-events:none}
#hills .hill{position:absolute;bottom:-2px;border-radius:50% 50% 0 0}
#hills .h1{left:-12vw;width:70vw;height:20vh;background:var(--grass)}
#hills .h2{right:-16vw;width:80vw;height:16vh;background:var(--grass2)}
#hills .h3{left:22vw;width:60vw;height:12vh;background:#8bc34a}
.pollenMote{position:absolute;width:7px;height:7px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#ffe9a8,var(--honey));opacity:.75;box-shadow:0 0 8px rgba(247,179,43,.8);animation:moteUp linear infinite;bottom:-3vh}
@keyframes moteUp{0%{transform:translateY(0) translateX(0);opacity:0}8%{opacity:.8}92%{opacity:.6}100%{transform:translateY(-108vh) translateX(6vw);opacity:0}}
body.nofancy .pollenMote,body.nofancy .cloud{display:none}

/* ---------- top bar ---------- */
#topbar{position:relative;z-index:5;display:flex;align-items:center;gap:14px;padding:8px 16px;background:linear-gradient(180deg,#5a3d18,#4a3117);border-bottom:3px solid var(--honey);box-shadow:0 4px 18px rgba(43,26,8,.45)}
#topbar .logo{display:flex;align-items:center;gap:10px;font-family:var(--f-head);font-weight:800;font-size:clamp(17px,2.2vw,24px);color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.35);white-space:nowrap}
#topbar .logo svg{filter:drop-shadow(0 2px 2px rgba(0,0,0,.4))}
#ticker{flex:1;min-width:0;text-align:center;font-weight:700;font-size:clamp(11px,1.4vw,14.5px);color:var(--cream2);opacity:.95;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;transition:opacity .4s}
#ticker.fade{opacity:0}
#saveDot{display:flex;align-items:center;gap:6px;font-size:11px;font-weight:800;color:#c9b58a;white-space:nowrap}
#saveDot .dot{width:9px;height:9px;border-radius:50%;background:#79834f;transition:background .3s,box-shadow .3s}
#saveDot .dot.on{background:var(--good);box-shadow:0 0 8px var(--good)}

/* ---------- layout ---------- */
#game{position:relative;z-index:2;display:flex;gap:14px;padding:12px;height:calc(100dvh - 52px)}
.panel{background:linear-gradient(160deg,var(--panel2) 0%,var(--panel) 60%,var(--panel3) 100%);border:2px solid var(--honey3);border-radius:16px;box-shadow:inset 0 0 60px rgba(0,0,0,.35),0 8px 24px rgba(30,18,4,.35);position:relative;overflow:hidden}
.panel::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(115deg,rgba(255,255,255,.022) 0 2px,transparent 2px 16px)}
#gardenPanel{flex:1.15;display:flex;flex-direction:column;min-width:340px}
#shopPanel{flex:1;display:flex;flex-direction:column;min-width:390px;max-width:560px}

/* ---------- garden ---------- */
#pollenBox{text-align:center;padding:12px 10px 4px;position:relative;z-index:3}
#pollenCount{font-family:var(--f-head);font-weight:800;font-size:clamp(26px,3.4vw,40px);color:var(--gold);text-shadow:0 2px 0 #7a4c06,0 4px 14px rgba(0,0,0,.4);line-height:1.05}
#pollenCount small{font-size:.55em;color:var(--cream2);text-shadow:0 2px 0 rgba(0,0,0,.3)}
#cpsBox{font-weight:800;font-size:clamp(12px,1.5vw,15px);color:var(--cream2);margin-top:2px}
#gardenScene{flex:1;position:relative;margin:6px 12px 8px;border-radius:14px;background:radial-gradient(120% 90% at 50% 100%,var(--grass) 0 42%,var(--grass2) 78%,#3e611f 100%);box-shadow:inset 0 6px 24px rgba(0,0,0,.28),inset 0 0 0 3px rgba(255,214,102,.25);overflow:hidden}
#gardenScene .grassTuft{position:absolute;bottom:0;width:26px;height:16px;background:radial-gradient(circle at 50% 100%,#8bc34a 0 45%,transparent 46%);opacity:.7}
#flowerWrap{position:absolute;left:50%;top:46%;transform:translate(-50%,-50%);width:min(46%,300px);aspect-ratio:1;cursor:pointer;z-index:4;-webkit-user-drag:none}
#flowerWrap svg{width:100%;height:100%;display:block;filter:drop-shadow(0 10px 14px rgba(0,0,0,.35));transition:transform .08s ease-out}
#flowerWrap:hover svg{transform:scale(1.03)}
#flowerWrap.squish svg{transform:scale(.92) rotate(-2deg)}
#petalSpin{transform-origin:120px 120px;animation:petalSpin 42s linear infinite}
@keyframes petalSpin{to{transform:rotate(360deg)}}
#flowerGlow{position:absolute;left:50%;top:46%;width:min(56%,360px);aspect-ratio:1;transform:translate(-50%,-50%);border-radius:50%;background:radial-gradient(circle,rgba(255,214,102,.28) 0 30%,transparent 68%);pointer-events:none;z-index:3;animation:glowPulse 3.2s ease-in-out infinite}
@keyframes glowPulse{50%{transform:translate(-50%,-50%) scale(1.08);opacity:.75}}
.swarmBee{position:absolute;left:0;top:0;pointer-events:none;z-index:8;will-change:transform;filter:drop-shadow(0 3px 4px rgba(0,0,0,.28))}
.swarmBee svg{display:block}
body.nofancy .swarmBee,body.nofancy #flowerGlow{display:none}
.decoFlower{position:absolute;width:34px;height:34px;z-index:2;pointer-events:none;opacity:.95}
.beeToastHelper{display:none}
.floater{position:absolute;z-index:9;font-family:var(--f-head);font-weight:800;color:#fff;text-shadow:0 2px 0 rgba(122,76,6,.9),0 0 12px rgba(255,209,102,.65);pointer-events:none;animation:floatUp .95s ease-out forwards;font-size:clamp(14px,1.8vw,20px)}
.floater.gold{color:#ffe9a8;font-size:clamp(18px,2.4vw,26px)}
@keyframes floatUp{0%{transform:translateY(0) scale(.85);opacity:0}12%{opacity:1;transform:translateY(-8px) scale(1.06)}100%{transform:translateY(-74px) scale(1);opacity:0}}
.spark{position:absolute;width:8px;height:8px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff6d8,var(--honey2));pointer-events:none;z-index:8;animation:sparkFly .7s ease-out forwards}
@keyframes sparkFly{to{transform:translate(var(--dx),var(--dy)) scale(.2);opacity:0}}
/* golden flower */
.gflower{position:absolute;width:76px;height:76px;z-index:7;cursor:pointer;filter:drop-shadow(0 0 14px rgba(255,214,102,.95));animation:gPop .45s cubic-bezier(.2,1.6,.4,1),gWob 1.1s .45s ease-in-out infinite}
.gflower.storm{width:60px;height:60px;filter:drop-shadow(0 0 18px rgba(255,214,102,1));animation:gPop .32s cubic-bezier(.2,1.6,.4,1),gWob .65s .3s ease-in-out infinite}
@keyframes gPop{from{transform:scale(0)}to{transform:scale(1)}}
@keyframes gWob{50%{transform:scale(1.1) rotate(8deg)}}
.gflower svg{width:100%;height:100%}
.gflower .gTtl{position:absolute;top:-20px;left:50%;transform:translateX(-50%);font-size:11px;font-weight:900;color:#fff8dc;text-shadow:0 1px 3px rgba(120,70,0,.9);white-space:nowrap}
/* buffs */
#buffBar{position:absolute;top:8px;right:8px;display:flex;flex-direction:column;gap:6px;z-index:10;align-items:flex-end}
.buff{background:linear-gradient(160deg,rgba(61,40,14,.96),rgba(46,29,9,.96));border:2px solid var(--honey2);border-radius:12px;padding:6px 10px;min-width:150px;box-shadow:0 4px 14px rgba(0,0,0,.4);animation:buffIn .25s ease-out}
.buff .bName{font-family:var(--f-head);font-weight:800;font-size:13px;color:var(--gold)}
.buff .bTime{font-size:11px;font-weight:800;color:var(--cream2)}
.buff.cosmic{border-color:#d8b4ff}
.buff.cosmic .bName{color:#e3c5ff}
@keyframes buffIn{from{transform:translateX(30px);opacity:0}}
/* honey bar */
#honeyBar{margin:2px 14px 12px;padding:8px 12px;background:rgba(0,0,0,.3);border:2px solid var(--honey3);border-radius:12px;position:relative;z-index:3}
#honeyBar .hLabel{display:flex;justify-content:space-between;font-size:11.5px;font-weight:800;color:var(--cream2);margin-bottom:5px}
#honeyBar .hLabel b{color:var(--gold)}
.hTrack{height:14px;border-radius:8px;background:rgba(0,0,0,.42);overflow:hidden;box-shadow:inset 0 2px 5px rgba(0,0,0,.5)}
.hFill{height:100%;width:0%;border-radius:8px;background:linear-gradient(90deg,var(--honey3),var(--honey) 60%,var(--honey2));position:relative;transition:width .8s ease}
.hFill::after{content:"";position:absolute;inset:0;background:repeating-linear-gradient(115deg,rgba(255,255,255,.35) 0 3px,transparent 3px 12px);opacity:.4;animation:hShine 2.6s linear infinite}
@keyframes hShine{to{transform:translateX(24px)}}
/* ---------- shop panel / tabs ---------- */
#tabs{display:flex;gap:4px;padding:10px 10px 0;position:relative;z-index:4;flex-wrap:wrap}
#tabs button{flex:1;min-width:64px;background:rgba(0,0,0,.32);border:2px solid transparent;border-bottom:none;color:#d9c49a;font-family:var(--f-head);font-weight:700;font-size:clamp(11px,1.35vw,14px);padding:8px 6px 9px;border-radius:11px 11px 0 0;transition:background .15s,color .15s;position:relative}
#tabs button:hover{background:rgba(0,0,0,.45);color:var(--cream)}
#tabs button.active{background:linear-gradient(180deg,var(--honey2),var(--honey));color:#4a2f10;border-color:var(--honey3);box-shadow:0 -3px 12px rgba(255,209,102,.25)}
#tabs button .bdg{position:absolute;top:-4px;right:2px;background:var(--danger);color:#fff;font-size:9.5px;font-weight:900;border-radius:9px;padding:1px 5px;box-shadow:0 2px 5px rgba(0,0,0,.5)}
.view{flex:1;display:none;flex-direction:column;min-height:0;padding:10px 12px 14px;position:relative;z-index:3}
.view.on{display:flex}
.viewHead{display:flex;align-items:center;justify-content:space-between;gap:8px;margin-bottom:8px;flex-wrap:wrap}
.viewHead h2{font-family:var(--f-head);font-weight:800;font-size:17px;color:var(--gold);text-shadow:0 2px 0 rgba(0,0,0,.4)}
.seg{display:flex;background:rgba(0,0,0,.35);border-radius:10px;padding:3px;border:1px solid rgba(255,209,102,.25)}
.seg button{background:transparent;border:none;color:#d9c49a;font-weight:800;font-size:12px;padding:4px 10px;border-radius:8px}
.seg button.active{background:var(--honey);color:#3a2410}
.seg.danger button.active{background:var(--danger);color:#fff}
.scrollArea{flex:1;overflow-y:auto;overflow-x:hidden;min-height:0;padding-right:4px}

/* ---------- tower rows ---------- */
.trow{display:flex;align-items:center;gap:10px;background:linear-gradient(160deg,rgba(84,56,24,.85),rgba(56,36,14,.9));border:2px solid rgba(201,138,16,.5);border-radius:13px;padding:8px 10px;margin-bottom:8px;cursor:pointer;transition:transform .08s,border-color .15s,box-shadow .15s;position:relative}
.trow:hover{border-color:var(--honey2);transform:translateY(-1px)}
.trow.locked{display:none}
.trow.cant{cursor:default;opacity:.55;filter:saturate(.6)}
.trow.cant:hover{transform:none;border-color:rgba(201,138,16,.5)}
.trow.canBuy{border-color:var(--honey2);box-shadow:0 0 14px rgba(255,209,102,.22)}
.trow.sellMode{border-color:var(--danger)}
.trow .beeIco{width:52px;height:52px;flex:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.trow .tInfo{flex:1;min-width:0}
.trow .tName{font-family:var(--f-head);font-weight:800;font-size:14.5px;color:var(--cream);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.trow .tName .tOwned{color:var(--honey2);margin-left:6px;font-size:15px}
.trow .tSub{font-size:11px;font-weight:700;color:#c9b58a;margin-top:1px}
.price{flex:none;font-weight:900;font-size:12.5px;background:rgba(0,0,0,.4);color:#a8977a;border:1.5px solid rgba(201,138,16,.5);padding:5px 10px;border-radius:20px;white-space:nowrap}
.price.ok{background:linear-gradient(180deg,var(--honey2),var(--honey));color:#3a2410;border-color:var(--honey4);box-shadow:0 2px 8px rgba(255,178,43,.35)}
.price.sell{background:linear-gradient(180deg,#f59a86,var(--danger));color:#4a130a;border-color:#8f3b2c}
.tStore{display:flex;flex-direction:column;align-items:flex-end;gap:3px}
.tStore .pct{font-size:9.5px;font-weight:800;color:#c9b58a}

/* ---------- upgrades ---------- */
#upgradeGrid{display:flex;flex-wrap:wrap;gap:8px;align-content:flex-start}
.upTile{width:58px;height:58px;border-radius:14px;background:linear-gradient(160deg,#5f3d1b,#432a10);border:2px solid var(--utier,var(--honey3));display:flex;align-items:center;justify-content:center;cursor:pointer;position:relative;transition:transform .1s,box-shadow .15s;box-shadow:inset 0 0 12px rgba(0,0,0,.4)}
.upTile svg{width:34px;height:34px}
.upTile:hover{transform:translateY(-2px) scale(1.05)}
.upTile.can{box-shadow:inset 0 0 12px rgba(0,0,0,.4),0 0 14px rgba(255,209,102,.45);animation:upPulse 1.6s ease-in-out infinite}
@keyframes upPulse{50%{box-shadow:inset 0 0 12px rgba(0,0,0,.4),0 0 20px rgba(255,209,102,.7)}}
.upTile.cant{opacity:.5;filter:saturate(.5)}
.upEmpty{color:#a8977a;font-weight:700;font-size:13px;padding:14px 4px;line-height:1.5}

/* ---------- rebirth ---------- */
.rebBox{background:linear-gradient(160deg,rgba(90,52,120,.35),rgba(40,24,10,.5));border:2px solid #b388e0;border-radius:14px;padding:12px;margin-bottom:12px}
.rebBox h3{font-family:var(--f-head);color:#e3c5ff;font-size:16px;font-weight:800;margin-bottom:6px}
.rebBox .rebLine{font-size:12.5px;font-weight:700;color:var(--cream2);margin:3px 0}
.rebBox .rebLine b{color:#fff}
.rebProg{height:14px;background:rgba(0,0,0,.45);border-radius:8px;overflow:hidden;margin:8px 0;box-shadow:inset 0 2px 5px rgba(0,0,0,.5)}
.rebProg div{height:100%;width:0%;background:linear-gradient(90deg,#7e57c2,#d8b4ff);transition:width .6s}
.btn{background:linear-gradient(180deg,var(--honey2),var(--honey));color:#3a2410;border:2px solid var(--honey4);border-radius:11px;font-family:var(--f-head);font-weight:800;font-size:14px;padding:9px 16px;box-shadow:0 3px 0 var(--honey4),0 5px 12px rgba(0,0,0,.3);transition:transform .07s,filter .15s}
.btn:hover{filter:brightness(1.07)}
.btn:active{transform:translateY(2px);box-shadow:0 1px 0 var(--honey4)}
.btn:disabled{background:#6b5b3d;color:#a2937a;border-color:#4a3d26;box-shadow:0 3px 0 #4a3d26;cursor:not-allowed}
.btn.purple{background:linear-gradient(180deg,#d8b4ff,#a678e8);border-color:#5e3a96;color:#31184f;box-shadow:0 3px 0 #5e3a96,0 5px 12px rgba(0,0,0,.3)}
.btn.purple:disabled{background:#5a4a6e;color:#a99bbd;border-color:#3a2f4a;box-shadow:0 3px 0 #3a2f4a}
.btn.danger{background:linear-gradient(180deg,#f59a86,var(--danger));border-color:#8f3b2c;color:#4a130a;box-shadow:0 3px 0 #8f3b2c}
.btn.small{font-size:12px;padding:6px 12px}
.perk{display:flex;align-items:center;gap:10px;background:linear-gradient(160deg,rgba(84,56,24,.85),rgba(56,36,14,.9));border:2px solid rgba(179,136,224,.55);border-radius:13px;padding:9px 10px;margin-bottom:8px;cursor:pointer;transition:border-color .15s,transform .08s}
.perk:hover{border-color:#d8b4ff}
.perk.maxed{opacity:.65;cursor:default;border-color:rgba(156,204,101,.6)}
.perk.cant{opacity:.55}
.perk.cant:hover{border-color:rgba(179,136,224,.55)}
.perk .pIco{width:40px;height:40px;flex:none}
.perk .pInfo{flex:1;min-width:0}
.perk .pName{font-family:var(--f-head);font-weight:800;font-size:13.5px;color:#e9d5ff}
.perk .pDesc{font-size:11px;font-weight:700;color:#c9b58a;margin-top:1px;line-height:1.35}
.tokPrice{flex:none;display:flex;align-items:center;gap:5px;font-weight:900;font-size:13px;background:rgba(0,0,0,.4);border:1.5px solid #b388e0;color:#e3c5ff;padding:5px 10px;border-radius:20px;white-space:nowrap}
.tokPrice.ok{background:linear-gradient(180deg,#d8b4ff,#a678e8);color:#31184f;box-shadow:0 2px 8px rgba(166,120,232,.4)}
.tokPrice.max{border-color:var(--good);color:var(--good)}
.tokenIco{display:inline-block;vertical-align:-2px}

/* ---------- achievements ---------- */
#achGrid{display:flex;flex-wrap:wrap;gap:7px;align-content:flex-start}
.achCell{width:46px;height:46px;clip-path:polygon(25% 3%,75% 3%,98% 50%,75% 97%,25% 97%,2% 50%);background:linear-gradient(160deg,#4a3117,#33210d);display:flex;align-items:center;justify-content:center;cursor:pointer;transition:transform .1s}
.achCell:hover{transform:scale(1.12)}
.achCell svg{width:24px;height:24px;opacity:.4}
.achCell.got{background:linear-gradient(160deg,var(--honey2),var(--honey3));box-shadow:0 0 10px rgba(255,209,102,.45)}
.achCell.got svg{opacity:1}

/* ---------- stats ---------- */
.statRow{display:flex;justify-content:space-between;gap:10px;padding:7px 4px;border-bottom:1px dashed rgba(201,138,16,.3);font-size:12.5px;font-weight:700;color:#d9c49a}
.statRow b{color:var(--cream);text-align:right}
.statGroup{font-family:var(--f-head);font-weight:800;color:var(--gold);font-size:13.5px;margin:12px 0 4px;text-transform:uppercase;letter-spacing:.06em}

/* ---------- options ---------- */
.optBox{background:rgba(0,0,0,.28);border:1.5px solid rgba(201,138,16,.4);border-radius:12px;padding:11px;margin-bottom:10px}
.optBox h4{font-family:var(--f-head);font-size:13.5px;color:var(--gold);font-weight:800;margin-bottom:8px}
.optBox p{font-size:11.5px;font-weight:700;color:#c9b58a;line-height:1.5;margin-bottom:8px}
.btnRow{display:flex;gap:8px;flex-wrap:wrap}
textarea.saveCode{width:100%;height:110px;background:rgba(0,0,0,.45);border:1.5px solid rgba(201,138,16,.5);border-radius:10px;color:var(--cream);font-family:ui-monospace,monospace;font-size:11px;padding:8px;resize:vertical;user-select:text;-webkit-user-select:text}
.toggleRow{display:flex;align-items:center;justify-content:space-between;gap:10px;padding:5px 0}
.toggleRow span{font-size:12.5px;font-weight:800;color:var(--cream2)}
.tgl{width:46px;height:24px;border-radius:14px;background:#5a4628;border:2px solid #3a2c14;position:relative;transition:background .2s}
.tgl::after{content:"";position:absolute;top:1px;left:2px;width:17px;height:17px;border-radius:50%;background:#d9c49a;transition:transform .2s,background .2s}
.tgl.on{background:var(--good)}
.tgl.on::after{transform:translateX(20px);background:#fff}

/* ---------- tooltip / toast / modal ---------- */
#richTip{position:fixed;z-index:100;max-width:290px;background:linear-gradient(160deg,#4a3216,#33210d);border:2px solid var(--honey3);border-radius:12px;padding:10px 12px;pointer-events:none;display:none;box-shadow:0 10px 30px rgba(0,0,0,.55)}
#richTip .tpName{font-family:var(--f-head);font-weight:800;font-size:14px;color:var(--gold);margin-bottom:3px}
#richTip .tpLine{font-size:11.5px;font-weight:700;color:#d9c49a;line-height:1.45}
#richTip .tpLine b{color:var(--cream)}
#richTip .tpFlav{font-style:italic;color:#b39b6e;margin-top:5px;font-size:11px}
#richTip .tpCost{margin-top:6px;font-weight:900;font-size:12px;color:var(--honey2)}
#toasts{position:fixed;right:14px;bottom:14px;z-index:120;display:flex;flex-direction:column;gap:8px;max-width:min(330px,86vw)}
.toast{background:linear-gradient(160deg,#4a3216,#33210d);border:2px solid var(--honey3);border-radius:13px;padding:10px 13px;box-shadow:0 8px 24px rgba(0,0,0,.5);animation:toastIn .28s cubic-bezier(.2,1.4,.4,1);display:flex;gap:10px;align-items:center}
.toast.out{animation:toastOut .3s forwards}
@keyframes toastIn{from{transform:translateX(60px);opacity:0}}
@keyframes toastOut{to{transform:translateX(60px);opacity:0}}
.toast .tIco{width:34px;height:34px;flex:none}
.toast .tTitle{font-family:var(--f-head);font-weight:800;font-size:13.5px;color:var(--gold)}
.toast .tBody{font-size:11.5px;font-weight:700;color:#d9c49a;line-height:1.4}
.toast.ach{background:linear-gradient(160deg,#7a5a10,#4f3a06);border-color:var(--honey2);box-shadow:0 8px 24px rgba(255,178,43,.25)}
#modalLayer{position:fixed;inset:0;z-index:150;background:rgba(20,12,2,.6);backdrop-filter:blur(3px);display:none;align-items:center;justify-content:center;padding:18px}
#modalLayer.on{display:flex}
.modal{width:min(480px,94vw);max-height:86dvh;overflow-y:auto;background:linear-gradient(160deg,var(--panel2),var(--panel3));border:2px solid var(--honey3);border-radius:16px;padding:18px;box-shadow:0 18px 60px rgba(0,0,0,.6);animation:mIn .22s ease-out}
@keyframes mIn{from{transform:scale(.92) translateY(12px);opacity:0}}
.modal h3{font-family:var(--f-head);font-size:19px;color:var(--gold);font-weight:800;margin-bottom:8px}
.modal .mBody{font-size:13px;font-weight:700;color:var(--cream2);line-height:1.55;margin-bottom:14px}
.modal .mBody b{color:var(--honey2)}
.modal .btnRow{justify-content:flex-end;margin-top:6px}

/* ---------- responsive ---------- */
@media (max-width:940px){
  body{overflow:auto}
  #game{flex-direction:column;height:auto;min-height:calc(100dvh - 52px)}
  #gardenPanel{min-width:0;flex:none}
  #gardenScene{min-height:38vh}
  #flowerWrap{width:min(52%,240px)}
  #shopPanel{min-width:0;max-width:none;flex:none;height:70dvh}
  #topbar{padding:6px 10px;gap:8px}

}

  #ticker{display:none}
  #topbar .logo{font-size:16px}
  #game{padding:8px;gap:10px}

/* ============================ ASSET-DRIVEN BEE ART (v2) ============================ */
.beeShopImg{width:100%;height:100%;object-fit:contain;display:block;filter:drop-shadow(0 3px 4px rgba(0,0,0,.45))}
.beeFlyImg{width:100%;height:100%;object-fit:contain;display:block;pointer-events:none}

/* ============================ GIFTED BEE BADGE + BUTTON ============================ */

.trow.giftedRow .beeIco{position:relative}
.trow.giftedRow .beeIco::after{content:"";position:absolute;inset:-4px;border-radius:14px;background:radial-gradient(circle,rgba(255,209,102,.45) 0%,transparent 70%);pointer-events:none;animation:giftGlow 2.4s ease-in-out infinite}
@keyframes giftGlow{50%{transform:scale(1.08);opacity:.85}}
.giftBtn{font-family:var(--f-head);font-weight:800;font-size:10.5px;padding:4px 9px;border-radius:9px;border:1.5px solid #b8770e;background:linear-gradient(180deg,#3a2410,#2c1c0b);color:#ffd166;cursor:pointer;transition:transform .08s,box-shadow .15s;letter-spacing:.3px;white-space:nowrap;line-height:1.2;margin-top:3px}
.giftBtn:hover:not(.done):not(:disabled){transform:translateY(-1px);box-shadow:0 2px 8px rgba(255,209,102,.35)}
.giftBtn.can{background:linear-gradient(180deg,#ffd166,#f7b32b);color:#3a2410;border-color:#8a5a08;box-shadow:0 0 10px rgba(255,209,102,.45)}
.giftBtn.cant{opacity:.55;cursor:default}
.giftBtn.done{background:linear-gradient(180deg,#9ccc65,#7cb342);color:#1f3a0e;border-color:#5a8a2a;cursor:default;box-shadow:0 0 8px rgba(124,179,66,.4)}

/* ============================ BEE SYNERGY INFO LINE ============================ */

.synLine .synIco{color:#ffd166;margin-right:3px}
.synLine .synStacks{color:#9ccc65;font-weight:800;margin-left:4px}

.tStore{align-self:flex-start}

/* ============================ HIVE CHANGER (cosmetic skins) ============================ */
.skinCard{display:flex;align-items:center;gap:10px;background:linear-gradient(160deg,rgba(50,30,80,.55),rgba(30,20,10,.65));border:2px solid rgba(166,120,232,.45);border-radius:13px;padding:8px 10px;margin-bottom:8px;transition:border-color .15s,transform .08s,box-shadow .15s}

.panel::after{background:repeating-linear-gradient(115deg,rgba(255,255,255,.025) 0 2px,transparent 2px 18px)}
#topbar{box-shadow:0 4px 22px rgba(43,26,8,.55)}
.trow{transition:transform .08s,border-color .15s,box-shadow .15s,filter .15s}

/* ============================ v2: IMAGE-BASED MAIN FLOWER + DECO ============================ */
/* Override the original `#flowerWrap svg` rules so the new <img> main flower squishes/hovers identically.
   The main flower is wrapped in a .flowerScaler div (handles hover/squish scale) and the IMG inside
   rotates continuously (so the rotation doesn't conflict with the scale transforms). */
#flowerWrap .flowerScaler{display:block;width:100%;height:100%;transition:transform .08s ease-out;transform-origin:center center}

#flowerWrap.squish .flowerScaler{transform:scale(.92) rotate(-2deg)}

@keyframes mainFlowerSpin{to{transform:rotate(360deg)}}
.decoFlower{width:34px;height:34px;z-index:2;pointer-events:none;opacity:.95}
.decoFlowerImg{width:100%;height:100%;display:block;object-fit:contain;-webkit-user-drag:none;filter:drop-shadow(0 3px 4px rgba(0,0,0,.25))}

/* ============================ v3.2: INLINE BEE INFO PANEL (v/^ toggle) ============================ */

   A small v/^ button on the row toggles it open/closed. */

.infoToggle.open{background:linear-gradient(180deg,#ffd166,#f7b32b);color:#3a2410;border-color:#8a5a08}

@keyframes infoOpen{from{opacity:0;transform:translateY(-4px)}}
.infoPanel .tpName{font-family:var(--f-head);font-weight:800;font-size:13px;color:var(--gold);margin-bottom:3px}
.infoPanel .tpLine{font-size:11.5px;font-weight:700;color:#d9c49a;line-height:1.45}
.infoPanel .tpLine b{color:var(--cream)}
.infoPanel .tpFlav{font-style:italic;color:#b39b6e;margin-top:5px;font-size:10.5px}
.infoPanel .tpCost{margin-top:5px;font-weight:900;font-size:11.5px;color:var(--honey2)}

/* ============================ v3.2: SHRINK BEE ICON IN UPGRADES BY 20% ============================ */
/* .upTile is 58x58; original icon was 34x34. New: 27x27 (~20% smaller) for more padding. */
#upgradeGrid .upTile .beeShopImg{width:27px;height:27px;object-fit:contain}

/* ============================ v3.2: TOASTS MOVED TO TOP-LEFT (under title, left of pollen) ============================ */

@keyframes toastIn{from{transform:translateX(-60px);opacity:0}}
@keyframes toastOut{to{transform:translateX(-60px);opacity:0}}

<script>
"use strict";
/* ============================== UTILITIES ============================== */
const $=id=>document.getElementById(id);
const NUM_NAMES=['thousand','million','billion','trillion','quadrillion','quintillion','sextillion','septillion','octillion','nonillion','decillion','undecillion','duodecillion','tredecillion','quattuordecillion','quindecillion','sexdecillion','septendecillion','octodecillion','novemdecillion','vigintillion'];
function trimNum(n,d){let s=n.toFixed(d);if(s.indexOf('.')>=0)s=s.replace(/0+$/,'').replace(/\.$/,'');return s;}
function fmt(n){
  if(n===undefined||n===null||isNaN(n))return'0';
  if(!isFinite(n))return'infinity';
  if(n<0)return'-'+fmt(-n);
  if(n<1000){
    if(n===Math.floor(n)&&n<100)return String(n);
    return trimNum(n,n<10?2:(n<100?1:0));
  }
  const t=Math.floor(Math.log10(n)/3),idx=t-1;
  if(idx>=NUM_NAMES.length){const e=n.toExponential(2);return e.replace('e+','e');}
  const v=n/Math.pow(10,3*t);
  return trimNum(v,v>=100?1:(v>=10?2:3))+' '+NUM_NAMES[idx];
}
function fmtInt(n){return Math.floor(n).toLocaleString('en-US');}
function fmtTime(s){s=Math.max(0,Math.floor(s));const d=Math.floor(s/86400),h=Math.floor(s%86400/3600),m=Math.floor(s%3600/60),ss=s%60;
  if(d>0)return d+'d '+h+'h '+m+'m';if(h>0)return h+'h '+m+'m '+(ss>0?ss+'s':'');if(m>0)return m+'m '+(ss>0?ss+'s':'');return ss+'s';}
function rnd(a,b){return a+Math.random()*(b-a);}
function pick(arr){return arr[Math.floor(Math.random()*arr.length)];}

/* ============================== SVG ART ============================== */
let svgUid=0;
function beeIcon(i,size){
  const t=TOWERS[i],u='b'+(svgUid++);
  const stripes=`<g clip-path="url(#${u}c)"><rect x="26" y="14" width="7" height="36" fill="${t.c2}"/><rect x="37" y="14" width="7" height="36" fill="${t.c2}"/><rect x="48" y="14" width="7" height="36" fill="${t.c2}"/></g>`;
  let extra='';
  if(i===1)extra=`<circle cx="40" cy="32" r="21.5" fill="none" stroke="${t.c1}" stroke-width="2.6" stroke-dasharray="2 4.5" stroke-linecap="round" opacity=".9"/><path d="M17 20q-2-6 2-9M25 20q2-6-2-9" stroke="${t.c2}" stroke-width="1.8" fill="none" stroke-linecap="round"/><circle cx="19.4" cy="10.6" r="1.7" fill="${t.c2}"/><circle cx="22.6" cy="10.6" r="1.7" fill="${t.c2}"/>`;
  if(i===2)extra=`<path d="M13 21l3.5-8 4.5 4.5L21 9l3.5 8.5L29 13l3.5 8z" fill="#ffd166" stroke="#8a5a08" stroke-width="1.5"/><path d="M13.5 21.5l6.5 2.8M30.5 21.5l-6.5 2.8" stroke="${t.c2}" stroke-width="2.2" stroke-linecap="round"/>`;
  if(i===3)extra=`<circle cx="47" cy="10" r="5" fill="#37474f"/><path d="M47 5.4q.4-4 4.4-4.6" stroke="#37474f" stroke-width="2" fill="none"/><circle cx="52" cy=".6" r="2.1" fill="#ff7043"/><circle cx="36" cy="22" r="1.6" fill="#cfd8dc"/><circle cx="46" cy="40" r="1.6" fill="#cfd8dc"/><circle cx="33" cy="42" r="1.6" fill="#cfd8dc"/>`;
  if(i===4)extra=`<rect x="28" y="20" width="22" height="6" rx="2" fill="#173e47"/><rect x="30" y="18" width="8" height="3" rx="1.5" fill="#173e47"/>`;
  if(i===5)extra=`<path d="M40 5.5c2.6 3.4 4.4 5.7 4.4 7.9a4.4 4.4 0 11-8.8 0c0-2.2 1.8-4.5 4.4-7.9z" fill="#ffca28" stroke="#8a5a08" stroke-width="1.5"/><ellipse cx="40" cy="51.5" rx="6.5" ry="2.6" fill="#f7b32b" opacity=".8"/><path d="M32 26h16" stroke="#fff" stroke-opacity=".35" stroke-width="2"/>`;
  if(i===6)extra=`<path d="M31 14l2.6-7 3.4 5.6 3.4-7 3.4 7L47 7l2.6 7z" fill="#f48fb1" stroke="#880e4f" stroke-width="1.4"/><rect x="13.5" y="21.5" width="19" height="5.6" rx="2.8" fill="#3e1136"/><rect x="16" y="19.4" width="7" height="2.6" rx="1.3" fill="#3e1136"/>`;
  if(i===7)extra=`<rect x="26" y="14" width="26" height="5" rx="2.5" fill="#191f4d"/><path d="M28 27l8 3M56 27l-8 3" stroke="#191f4d" stroke-width="2" stroke-linecap="round"/><path d="M52 15l7-4-2 6" fill="none" stroke="#191f4d" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>`;

let AC=null;
function ac(){if(!AC){try{AC=new(window.AudioContext||window.webkitAudioContext)();}catch(e){}}return AC;}
function tone(f,dur,type,vol,when,slideTo){
  const a=ac();if(!a)return;
  const t0=a.currentTime+(when||0);
  const o=a.createOscillator(),g=a.createGain();
  o.type=type||'triangle';o.frequency.setValueAtTime(f,t0);
  if(slideTo)o.frequency.exponentialRampToValueAtTime(slideTo,t0+dur);
  g.gain.setValueAtTime(0.0001,t0);
  g.gain.exponentialRampToValueAtTime(vol||.08,t0+.012);
  g.gain.exponentialRampToValueAtTime(0.0001,t0+dur);
  o.connect(g);g.connect(a.destination);o.start(t0);o.stop(t0+dur+.05);
}
function sfx(kind){
  if(!state||state.muted)return;const a=ac();if(!a)return;
  if(a.state==='suspended'){a.resume().catch(()=>{});}
  switch(kind){
    case'click':tone(rnd(500,640),.07,'triangle',.05);break;
    case'buy':tone(420,.09,'triangle',.07);tone(630,.12,'triangle',.06,.07);break;
    case'upgrade':tone(520,.08,'square',.04);tone(780,.1,'square',.035,.06);tone(1040,.14,'square',.03,.12);break;
    case'ach':[523,659,784,1047].forEach((f,i)=>tone(f,.16,'triangle',.05,i*.09));break;
    case'gold':tone(880,.3,'sine',.06);tone(1320,.4,'sine',.05,.1);tone(1760,.5,'sine',.04,.2);break;
    case'err':tone(160,.18,'sawtooth',.04);break;
    case'rebirth':tone(220,.5,'sine',.07,0,880);tone(440,.6,'triangle',.05,.3,1320);break;
  }
}

    buyAmt:1, sell:false, muted:false, fancy:true
  };
}
let state=freshState();
let cpsCache=0, clickCache=1, achCount=0, honeyPct=0;
let ACHS=[]; // built later

function numSafe(v,def){v=Number(v);return isFinite(v)&&v>=0?v:def;}
function adoptState(raw){
  const s=freshState();
  try{
    const o=JSON.parse(raw);
    if(!o||typeof o!=='object')return false;
    s.pollen=numSafe(o.pollen,0);
    s.life=numSafe(o.life,0);
    s.allTime=numSafe(o.allTime,0);
    s.hand=numSafe(o.hand,0);
    s.autoPoll=numSafe(o.autoPoll,0);
    s.clicks=numSafe(o.clicks,0);
    if(Array.isArray(o.towers)){for(let i=0;i<NT;i++)s.towers[i]=Math.max(0,Math.floor(numSafe(o.towers[i],0)));}
    if(o.up&&typeof o.up==='object')s.up=o.up;
    if(o.ach&&typeof o.ach==='object')s.ach=o.ach;
    s.upBought=numSafe(o.upBought,0);
    s.rebirths=Math.floor(numSafe(o.rebirths,0));
    s.tokens=Math.floor(numSafe(o.tokens,0));
    s.tokEarn=Math.floor(numSafe(o.tokEarn,0));
    s.tokSpent=Math.floor(numSafe(o.tokSpent,0));
    if(o.perks&&typeof o.perks==='object')s.perks=o.perks;
    s.gold=numSafe(o.gold,0);
    if(Array.isArray(o.buffs))s.buffs=o.buffs.filter(b=>b&&b.id&&isFinite(b.until));
    s.started=numSafe(o.started,Date.now());
    s.play=numSafe(o.play,0);
    s.last=numSafe(o.last,Date.now());
    s.buyAmt=[1,10,100].includes(o.buyAmt)?o.buyAmt:1;
    s.sell=!!o.sell; s.muted=!!o.muted; s.fancy=o.fancy!==false;
    state=s; return true;
  }catch(e){return false;}
}

/* ============================== SAVE / LOAD ============================== */
function serializeState(){ state.last=Date.now(); return JSON.stringify(state); }
function saveGame(manual){
  try{ localStorage.setItem(SAVE_KEY,serializeState()); }catch(e){}
  const str=serializeState();
  try{
    if(str.length<=3600) document.cookie=CK_KEY+'='+encodeURIComponent(str)+'; path=/; max-age=31536000; SameSite=Lax';
    else document.cookie=CK_KEY+'=; path=/; max-age=0';
  }catch(e){}
  flashSave(manual?'saved':'autosaved');
}
function loadGame(){
  let raw=null;
  try{ raw=localStorage.getItem(SAVE_KEY); }catch(e){}
  if(!raw){ try{ const m=document.cookie.match(new RegExp('(?:^|; )'+CK_KEY+'=([^;]*)')); if(m)raw=decodeURIComponent(m[1]); }catch(e){} }
  if(raw&&adoptState(raw))return true;
  return false;
}
function wipeGame(){
  try{ localStorage.removeItem(SAVE_KEY); }catch(e){}
  try{ document.cookie=CK_KEY+'=; path=/; max-age=0'; }catch(e){}
  state=freshState();
  rebuildAll();
  recalc(true);
  toast('Fresh start','The garden has been cleared. A new swarm awaits.','hex');
}
function exportCode(){
  const json=serializeState();
  let b64=''; try{ b64=btoa(unescape(encodeURIComponent(json))); }catch(e){ return ''; }
  let h=0; for(let i=0;i<json.length;i++){ h=(h*31+json.charCodeAt(i))>>>0; }
  return 'BEE1.'+h.toString(36)+'.'+b64;
}
function importCode(code){
  try{
    code=(code||'').trim();
    if(code.indexOf('BEE1.')!==0)return{ok:false,msg:'That does not look like a Bee Swarm Clicker save code.'};
    const parts=code.split('.');
    if(parts.length<3)return{ok:false,msg:'Save code is incomplete.'};
    const json=decodeURIComponent(escape(atob(parts.slice(2).join('.'))));
    let h=0; for(let i=0;i<json.length;i++){ h=(h*31+json.charCodeAt(i))>>>0; }
    if(parseInt(parts[1],36)!==h)return{ok:false,msg:'Save code failed its checksum - it may be corrupted.'};
    if(!adoptState(json))return{ok:false,msg:'Save code is not valid save data.'};
    state.buffs=[];
    rebuildAll(); recalc(true); saveGame(true);
    return{ok:true};
  }catch(e){ return{ok:false,msg:'Could not read that save code.'}; }
}
function offlineGains(){
  const dt=(Date.now()-state.last)/1000;
  if(dt<120)return;
  recalc(true);
  const rate=Math.min(.9,.3+.15*plvl('offline'));
  const capped=Math.min(dt,8*3600);
  const gain=cpsCache*capped*rate;
  if(gain<=0)return;
  gainPollen(gain,false);
  openModal(`<h3>Welcome back</h3><div class="mBody">Your swarm kept working while you were away for <b>${fmtTime(dt)}</b>.<br><br>They collected <b>${fmt(gain)} pollen</b> (${Math.round(rate*100)}% offline rate, 8h cap).<br><br>Upgrade <b>Offline Buzz</b> in the Rebirth shop to improve this.</div><div class="btnRow"><button class="btn" onclick="closeModal()">Buzz on</button></div>`);
}
let saveFlashT=null;
function flashSave(txt){
  const dot=$('saveDotDot'),t=$('saveDotTxt');
  if(!dot)return; dot.classList.add('on');
  if(t){t.textContent=txt;}
  clearTimeout(saveFlashT);

const tip=$('richTip');

function showTip(html,x,y){

function bindTips(container,attr,populate){
  container.addEventListener('mousemove',e=>{
    const el=e.target.closest('['+attr+']');
    if(!el){hideTip();return;}
    const key=el.getAttribute(attr);

    else showTip(tip.innerHTML,e.clientX,e.clientY);
  });
  container.addEventListener('mouseleave',hideTip);

/* ============================== ECONOMY ============================== */
function plvl(id){return Math.max(0,Math.floor(state.perks[id]||0));}
function disc(){return Math.pow(.92,plvl('hive'));}
function towerUpCount(i){
  let c=0;for(let k=0;k<TIER_NAMES.length;k++){if(state.up['u_t'+i+'_'+k])c++;}
  return c;
}
function towerCps(i){
  return TOWERS[i].cps*Math.pow(2,towerUpCount(i))*state.towers[i];
}
function costOf(i,n){
  const o=state.towers[i];
  return TOWERS[i].base*Math.pow(1.15,o)*(Math.pow(1.15,n)-1)/0.15*disc();
}
function refundOf(i,n){
  const o=state.towers[i];
  return 0.25*TOWERS[i].base*Math.pow(1.15,o-n)*(Math.pow(1.15,n)-1)/0.15*disc();
}
function synRateSum(){
  let r=0;for(const s of SYN_UPGRADES){if(state.up[s.id])r+=s.rate;}
  return r;
}
function clickMultUpCount(){let c=0;for(let k=0;k<3;k++){if(state.up['ck'+k])c++;}return c;}
function cpsShareSum(){let r=0;CLICK_UPGRADES.forEach(u=>{if(u.kind==='cpsShare'&&state.up[u.id])r+=u.v;});return r;}
function buffMult(click){
  let m=1;
  for(const b of state.buffs){ if(b.until>Date.now()&&((!!b.click)===click)) m*=b.mult; }
  return m;
}
function recalc(force){
  let sum=0;
  for(let i=0;i<NT;i++)sum+=towerCps(i);
  const gm=(1+.25*plvl('motor'))*(1+plvl('bless'))*(1+.005*achCount)*(1+honeyPct*synRateSum())*buffMult(false);
  cpsCache=sum*gm;
  const share=cpsCache*cpsShareSum();
  clickCache=(Math.pow(2,clickMultUpCount())+share)*Math.pow(2,plvl('sting'))*buffMult(true);
  if(force)updateHeader();
}
function clickPowerBase(){ // without click buffs (for achievement)
  let sum=0;for(let i=0;i<NT;i++)sum+=towerCps(i);
  const gm=(1+.25*plvl('motor'))*(1+plvl('bless'))*(1+.005*achCount)*(1+honeyPct*synRateSum());
  const cps=sum*gm;
  return (Math.pow(2,clickMultUpCount())+cps*cpsShareSum())*Math.pow(2,plvl('sting'));
}
function gainPollen(amount,fromClick,earned){
  if(!(amount>0))return;
  state.pollen+=amount;
  if(earned!==false){ state.life+=amount; state.allTime+=amount; }
  if(fromClick)state.hand+=amount;
}

/* ============================== ACTIONS ============================== */
function buyTower(i){
  if(state.sell){
    const o=state.towers[i];if(o<=0)return;
    const n=Math.min(o,state.buyAmt);
    state.towers[i]-=n;
    gainPollen(refundOf(i,n),false,false);
    swarmDespawn(i);
    sfx('click');
  }else{
    const n=state.buyAmt,c=costOf(i,n);
    if(state.pollen<c){sfx('err');return;}
    state.pollen-=c;state.towers[i]+=n;
    for(let k=0;k<Math.min(n,3);k++)swarmSpawn(i,true);
    sfx('buy');
  }
  updateTowerRows();
  refreshUpgrades();
  updateHeader();
}
function buyUpgrade(id){
  const u=UPG_BY_ID[id];
  if(!u||state.up[id])return;
  if(state.pollen<u.cost){sfx('err');return;}
  state.pollen-=u.cost;
  state.up[id]=1;state.upBought++;
  sfx('upgrade');
  toast(u.name,u.desc,'gem');
  updateTowerRows();refreshUpgrades();updateHeader();
}
function buyPerk(id){
  const p=PERKS.find(x=>x.id===id);
  const lv=plvl(id);
  if(!p||lv>=p.max)return;
  const c=p.costs[lv];
  if(state.tokens<c){sfx('err');return;}
  state.tokens-=c;state.tokSpent+=c;
  state.perks[id]=lv+1;
  sfx('upgrade');
  toast(p.name,'Level '+(lv+1)+' unlocked: '+p.desc(lv+1),'crown');
  renderPerks();updateHeader();
}
function rebirthNeed(){return 1e9*Math.pow(2.5,state.rebirths);}
function rebirthEarn(){return Math.floor(Math.sqrt(state.life/1e9));}
function doRebirth(){
  const need=rebirthNeed(),earn=rebirthEarn();
  if(state.life<need||earn<=0)return;
  openModal(`<h3>Rebirth ${state.rebirths+1}</h3>
  <div class="mBody">You will lose: <b>pollen, bees and upgrades</b> of this run.<br>You will keep: <b>achievements, honey and rebirth tokens</b>.<br><br>You gain <b>${earn} rebirth token${earn===1?'':'s'}</b> right now.<br>The next rebirth will require <b>${fmt(1e9*Math.pow(2.5,state.rebirths+1))}</b> pollen this run.</div>
  <div class="btnRow"><button class="btn" onclick="closeModal()">Not yet</button><button class="btn purple" onclick="closeModal();confirmRebirth()">Rebirth now</button></div>`);
}
function confirmRebirth(){
  const need=rebirthNeed(),earn=rebirthEarn();
  if(state.life<need||earn<=0)return;
  state.rebirths++;state.tokens+=earn;state.tokEarn+=earn;
  state.pollen=HEADSTART[plvl('head')];state.life=0;
  state.towers=new Array(NT).fill(0);
  state.up={};state.upBought=0;state.buffs=[];
  removeGolden();endStorm();
  rebuildAll();swarmInit();recalc(true);saveGame(true);
  sfx('rebirth');
  openModal(`<h3>Reborn!</h3><div class="mBody">The hive hums with new energy.<br><br>You received <b>${earn} rebirth token${earn===1?'':'s'}</b>. Spend them in the <b>Rebirth Shop</b> below for permanent powers - or save up for something big.</div><div class="btnRow"><button class="btn purple" onclick="closeModal()">Begin again</button></div>`);
}

/* ============================== GOLDEN FLOWERS ============================== */
let goldenEl=null,goldenT=null,nextGolden=0;
let stormFlowers=[],storm={on:false,until:0,next:0},stormT=null;
function scheduleGolden(first){
  const base=first?rnd(60,120):rnd(120,300);
  nextGolden=Date.now()+base*1000/Math.max(1,Math.pow(2,plvl('nectar')));
}
function goldenStep(){
  const n=Date.now();
  if(storm.on){
    if(n>=storm.next&&stormFlowers.length<10){spawnGolden(true);storm.next=n+rnd(800,1500);}
    if(n>=storm.until)endStorm();
    return;
  }
  if(goldenEl)return; /* only one golden flower at a time - unless it is a Flower Storm */
  if(n>=nextGolden)spawnGolden(false);
}
function spawnGolden(stormMode){
  const scene=$('gardenScene');
  if(!stormMode&&goldenEl)return; /* hard guard: never two normal golden flowers - only storms stack */
  const el=document.createElement('div');
  el.className='gflower'+(stormMode?' storm':'');
  const w=scene.clientWidth||400,h=scene.clientHeight||300;
  el.style.left=rnd(8,Math.max(9,w-(stormMode?72:88)))+'px';
  el.style.top=rnd(8,Math.max(9,h-(stormMode?72:88)))+'px';
  el.innerHTML='<div class="gTtl">Golden!</div>'+flowerSVG(76,true);
  el.addEventListener('pointerdown',stormMode?clickStormFlower:clickGolden);
  scene.appendChild(el);
  sfx('gold');
  if(stormMode){
    stormFlowers.push(el);
    setTimeout(()=>{const k=stormFlowers.indexOf(el);if(k>=0)stormFlowers.splice(k,1);if(el.parentNode)el.parentNode.removeChild(el);},6000);
  }else{
    goldenEl=el;
    clearTimeout(goldenT);
    goldenT=setTimeout(removeGolden,13000);
  }
}
function removeGolden(){
  clearTimeout(goldenT);
  if(goldenEl&&goldenEl.parentNode)goldenEl.parentNode.removeChild(goldenEl);
  goldenEl=null;
  if(!storm.on)scheduleGolden(false);
}
function startStorm(){
  storm.on=true;storm.until=Date.now()+12000;storm.next=Date.now()+500;
  stormFlowers.forEach(f=>f.remove());stormFlowers.length=0;
  removeGolden();
  clearTimeout(stormT);
  stormT=setTimeout(endStorm,12500);
}
function endStorm(){
  storm.on=false;
  stormFlowers.forEach(f=>f.remove());stormFlowers.length=0;
  scheduleGolden(false);
}
function clickStormFlower(e){
  e.stopPropagation();
  state.gold++;
  const scene=$('gardenScene'),rect=scene.getBoundingClientRect();
  const gain=(Math.min(state.pollen*.04,cpsCache*240)+13)*Math.pow(2,plvl('charm'));
  gainPollen(gain,false);
  const fx=e.clientX-rect.left,fy=e.clientY-rect.top;
  spawnFloat(scene,fx-14,fy-24,'+'+fmt(gain),true);
  sfx('gold');
  const el=e.currentTarget;
  const k=stormFlowers.indexOf(el);
  if(k>=0)stormFlowers.splice(k,1);
  if(el.parentNode)el.parentNode.removeChild(el);
  updateHeader();
}
function rollOutcome(){
  const r=Math.random();let acc=0;
  for(const o of GF_OUTCOMES){acc+=o.w;if(r<acc)return o;}
  return GF_OUTCOMES[0];
}
function clickGolden(e){
  e.stopPropagation();
  const out=rollOutcome();
  state.gold++;
  const scene=$('gardenScene'),rect=scene.getBoundingClientRect();
  const fx=e.clientX-rect.left,fy=e.clientY-rect.top;
  if(out.id==='lucky'){
    const gain=(Math.min(state.pollen*.15,cpsCache*900)+13)*Math.pow(2,plvl('charm'));
    gainPollen(gain,false);
    toast('Lucky!','Your bees found a cache of '+fmt(gain)+' pollen!','flower');
  }else if(out.id==='cosmic'){
    const gain=Math.max(1000,cpsCache*1800);
    gainPollen(gain,false);
    toast('Cosmic Burst','A rain of stardust: +'+fmt(gain)+' pollen!','gem');
  }else if(out.id==='storm'){
    startStorm();
    spawnFloat(scene,fx-14,fy-24,'FLOWER STORM!',true);
    toast('Flower Storm!','Golden flowers are raining from the sky - grab them all!','flower');
  }else{
    addBuff(out);
    spawnFloat(scene,fx-14,fy-24,out.name+'!',true);
    toast(out.name+'!',out.desc+' for '+Math.round(out.dur*(1+.5*plvl('frenzyup')))+'s.','zap');
  }
  sfx('gold');
  removeGolden();
  updateHeader();
}
function addBuff(out){
  const dur=out.dur*(1+.5*plvl('frenzyup'));
  const ex=state.buffs.find(b=>b.id===out.id);
  if(ex)ex.until=Date.now()+dur*1000;
  else state.buffs.push({id:out.id,name:out.name,mult:out.mult,click:!!out.click,until:Date.now()+dur*1000});
  recalc(true);
}
function expireBuffs(){
  const n=Date.now();const before=state.buffs.length;
  state.buffs=state.buffs.filter(b=>b.until>n);
  if(state.buffs.length!==before)recalc(true);

function renderBuffs(){
  const bar=$('buffBar');const n=Date.now();

    const left=(b.until-n)/1000;
    return `<div class="buff${b.id==='cosmic'?' cosmic':''}"><div class="bName">${b.name} x${b.mult}</div><div class="bTime">${left.toFixed(0)}s remaining</div></div>`;
  }).join('');
}

const SYN_ROMAN=['I','II','III','IV','V','VI'];

  for(let i=0;i<NT;i++)for(let k=0;k<TIER_NAMES.length;k++){
    UPG_BY_ID['u_t'+i+'_'+k]={id:'u_t'+i+'_'+k,tower:i,tier:k,name:TIER_NAMES[k]+' '+TOWERS[i].name+'s',
      cost:TOWERS[i].base*TIER_COST[k],req:TIER_THRESH[k],desc:TOWERS[i].name+'s are twice as efficient.',
      color:UPG_TIER_COLORS[k]};
  }
  CLICK_UPGRADES.forEach(u=>{
    UPG_BY_ID[u.id]={id:u.id,click:true,name:u.name,cost:u.cost,req:u.req,desc:u.desc,kind:u.kind,
      color:u.kind==='clickX2'?'#ff8a65':'#4dd0e1'};
  });
  SYN_UPGRADES.forEach((u,idx)=>{
    UPG_BY_ID[u.id]={id:u.id,syn:true,name:u.name+' '+SYN_ROMAN[idx],cost:u.cost,reqHoney:u.reqHoney,
      desc:u.desc,color:'#ba68c8'};
  });
}
function upgradeUnlocked(u){
  if(state.up[u.id])return false;
  if(u.tower!==undefined)return state.towers[u.tower]>=u.req;
  if(u.click)return state.towers[0]>=u.req;
  if(u.syn)return honeyPct>=u.reqHoney;
  return false;
}
function upgradeIcon(u){
  if(u.tower!==undefined)return beeIcon(u.tower,34);
  if(u.click)return ico(u.kind==='clickX2'?'zap':'wing',34);
  return ico('heart',34);
}

/* ============================== RENDER: TOWERS ============================== */
const rowEls=[];
function towerVisible(i){return i===0||state.towers[i-1]>0||state.towers[i]>0;}
function buildTowerRows(){
  const list=$('towerList');list.innerHTML='';rowEls.length=0;
  for(let i=0;i<NT;i++){
    const el=document.createElement('div');
    el.className='trow';el.dataset.i=i;
    el.innerHTML=`<div class="beeIco">${beeIcon(i,52)}</div>
    <div class="tInfo"><div class="tName">${TOWERS[i].name} <span class="tOwned"></span></div><div class="tSub"></div></div>
    <div class="tStore"><div class="price"></div><div class="pct"></div></div>`;
    el.addEventListener('click',()=>buyTower(i));
    list.appendChild(el);
    rowEls.push({row:el,owned:el.querySelector('.tOwned'),sub:el.querySelector('.tSub'),
      price:el.querySelector('.price'),pct:el.querySelector('.pct')});
  }
}
function updateTowerRows(){
  let total=0;for(let i=0;i<NT;i++)total+=towerCps(i);
  for(let i=0;i<NT;i++){
    const r=rowEls[i];if(!r)continue;
    const vis=towerVisible(i);
    r.row.classList.toggle('locked',!vis);
    if(!vis)continue;
    const o=state.towers[i];
    r.owned.textContent=o>0?'x '+fmtInt(o):'';
    const each=TOWERS[i].cps*Math.pow(2,towerUpCount(i));
    const tot=each*o;
    r.sub.textContent='each: '+fmt(each)+'/s'+(o>0?' — total: '+fmt(tot)+'/s':'');
    if(state.sell){
      if(o<=0){r.price.textContent='none';r.price.className='price';r.row.classList.add('cant');r.row.classList.remove('canBuy','sellMode');}
      else{
        const n=Math.min(o,state.buyAmt);
        r.price.textContent='+'+fmt(refundOf(i,n));
        r.price.className='price sell';
        r.row.classList.remove('cant','canBuy');r.row.classList.add('sellMode');
      }
      r.pct.textContent='sell '+n;
    }else{
      const c=costOf(i,state.buyAmt);
      r.price.textContent=fmt(c);
      const ok=state.pollen>=c;
      r.price.className='price'+(ok?' ok':'');
      r.row.classList.toggle('cant',!ok);
      r.row.classList.toggle('canBuy',ok);
      r.row.classList.remove('sellMode');
      r.pct.innerHTML=total>0&&tot>0?('+'+trimNum(tot/total*100,1)+'% of pollen'):'&nbsp;';
    }
  }
}
function towerTip(i){
  const t=TOWERS[i],o=state.towers[i],each=t.cps*Math.pow(2,towerUpCount(i));
  let html=`<div class="tpName">${t.name}</div>
  <div class="tpLine">${o>0?'<b>'+fmtInt(o)+'</b> owned':'not owned yet'}</div>
  <div class="tpLine">Each produces <b>${fmt(each)}</b> pollen/s</div>`;
  if(o>0)html+=`<div class="tpLine">Together: <b>${fmt(each*o)}</b> pollen/s</div>`;
  if(i===0)html+=`<div class="tpLine">More Basic Bees make your <b>taps</b> feel mightier.</div>`;
  const nextTier=TIER_THRESH.findIndex((th,k)=>!state.up['u_t'+i+'_'+k]);
  if(nextTier>=0)html+=`<div class="tpLine">Next upgrade at <b>${TIER_THRESH[nextTier]}</b> owned.</div>`;
  html+=`<div class="tpFlav">${t.flav}</div>`;
  return html;
}

/* ============================== RENDER: UPGRADES ============================== */
let lastUpKey='';
function refreshUpgrades(force){
  const vis=Object.values(UPG_BY_ID).filter(upgradeUnlocked);
  vis.sort((a,b)=>a.cost-b.cost);
  const key=vis.map(u=>u.id).join(',');
  const grid=$('upgradeGrid');
  if(key!==lastUpKey||force){
    lastUpKey=key;
    grid.innerHTML=vis.map(u=>`<div class="upTile" data-up="${u.id}" style="--utier:${u.color}">${upgradeIcon(u)}</div>`).join('');
    $('upEmpty').style.display=vis.length?'none':'block';
  }
  grid.querySelectorAll('[data-up]').forEach(el=>{
    const u=UPG_BY_ID[el.getAttribute('data-up')];
    el.classList.toggle('can',state.pollen>=u.cost);
    el.classList.toggle('cant',state.pollen<u.cost);
    el.onclick=()=>buyUpgrade(u.id);
  });
  const afford=vis.filter(u=>state.pollen>=u.cost).length;
  const bdg=$('upBdg');
  bdg.style.display=afford>0?'inline-block':'none';
  bdg.textContent=afford;
  $('upCountLbl').textContent=state.upBought+' owned / '+Object.keys(UPG_BY_ID).length+' total';
}
function upgradeTip(id){
  const u=UPG_BY_ID[id];if(!u)return'';
  let html=`<div class="tpName">${u.name}</div><div class="tpLine">${u.desc}</div>`;
  if(u.tower!==undefined)html+=`<div class="tpLine">Unlocked at <b>${u.req}</b> ${TOWERS[u.tower].name}s.</div>`;
  if(u.syn)html+=`<div class="tpLine">Requires <b>${u.reqHoney}% honey</b> (achievements).</div>`;
  if(u.click)html+=`<div class="tpLine">Requires <b>${u.req}</b> Basic Bees.</div>`;
  html+=`<div class="tpCost">Cost: ${fmt(u.cost)} pollen</div>`;
  return html;
}

function copyText(txt,btn){
  const done=()=>toast('Copied','Save code copied to clipboard.','swap');
  try{
    if(navigator.clipboard&&navigator.clipboard.writeText){navigator.clipboard.writeText(txt).then(done,()=>{fallback();});}
    else fallback();
  }catch(e){fallback();}
  function fallback(){
    const ta=document.createElement('textarea');
    ta.value=txt;document.body.appendChild(ta);ta.select();
    try{document.execCommand('copy');done();}catch(e){toast('Copy failed','Select the text and copy it manually.','swap');}
    document.body.removeChild(ta);
  }
}

  const code=exportCode();

  $('expCopy').onclick=()=>copyText($('expTa').value);
  $('expDl').onclick=()=>{

    const dl=document.createElement('a');dl.href=url;dl.download='bee-swarm-clicker-save.txt';dl.click();
    setTimeout(()=>URL.revokeObjectURL(url),4000);

}

/* ============================== GARDEN SWARM ============================== */
const SWARM_CAP=34;
let swarm=[];
function swarmSpawn(i,enter){
  const scene=$('gardenScene');if(!scene||swarm.length>=SWARM_CAP)return;
  const el=document.createElement('div');
  el.className='swarmBee';
  const sz=26+Math.min(16,i);
  el.innerHTML=beeIcon(i,sz);
  scene.appendChild(el);
  const w=scene.clientWidth||420,h=scene.clientHeight||320;
  const b={el,i,half:sz/2,ph:Math.random()*20,ang:Math.random()*Math.PI*2,
    rad:Math.max(.12,Math.min(.4,.22+(Math.random()-.5)*.22)),
    dir:Math.random()<.5?-1:1,spin:.25+Math.random()*.5,
    spd:1.1+Math.random()*.9+i*.015,retarget:1+Math.random()*2,x:0,y:0};
  if(enter){
    const side=Math.floor(Math.random()*4);
    if(side===0){b.x=-28;b.y=Math.random()*h;}
    else if(side===1){b.x=w+28;b.y=Math.random()*h;}
    else if(side===2){b.x=Math.random()*w;b.y=-28;}
    else{b.x=Math.random()*w;b.y=h+28;}
  }else{
    b.x=w*.5+Math.cos(b.ang)*w*b.rad;b.y=h*.46+Math.sin(b.ang)*h*b.rad*.7;
  }
  swarm.push(b);
}
function swarmDespawn(i){
  for(let k=swarm.length-1;k>=0;k--){
    if(swarm[k].i===i){const b=swarm[k];b.el.remove();swarm.splice(k,1);return;}
  }
}
function swarmInit(){
  swarm.forEach(b=>b.el.remove());swarm.length=0;
  const queue=[];
  for(let i=0;i<NT;i++)if(state.towers[i]>0)queue.push(i);
  const perType=Math.max(1,Math.floor(SWARM_CAP/Math.max(1,queue.length)));
  for(let p=1;p<perType;p++)for(let i=NT-1;i>=0;i--)if(state.towers[i]>p)queue.push(i);
  queue.slice(0,SWARM_CAP).forEach(i=>swarmSpawn(i,false));
}
function swarmTick(dt){
  if(!swarm.length)return;
  const scene=$('gardenScene');if(!scene)return;
  const w=scene.clientWidth,h=scene.clientHeight,cx=w*.5,cy=h*.46;
  const t=performance.now()/1000;
  for(const b of swarm){
    b.retarget-=dt;
    if(b.retarget<=0){
      b.retarget=1.4+Math.random()*2.6;
      b.ang+=(Math.random()-.5)*1.8;
      b.rad=Math.max(.1,Math.min(.42,b.rad+(Math.random()-.5)*.2));
      if(Math.random()<.18)b.dir=-b.dir;
    }
    b.ang+=b.spin*b.dir*dt;
    const wob=1+.25*Math.sin(t*1.35+b.ph*2.3);
    const tx=cx+Math.cos(b.ang)*w*b.rad*wob;
    const ty=cy+Math.sin(b.ang)*h*b.rad*wob*.66+Math.sin(t*2.2+b.ph)*8;
    const k=Math.min(1,dt*b.spd);
    b.x+=(tx-b.x)*k;b.y+=(ty-b.y)*k;
    b.x+=Math.cos(t*1.1+b.ph)*dt*8;b.y+=Math.sin(t*1.45+b.ph*1.3)*dt*8;
    const face=Math.cos(b.ang)*b.dir>=0?1:-1;
    b.el.style.transform='translate('+(b.x-b.half)+'px,'+(b.y-b.half)+'px) scaleX('+face+')';
  }
}

/* ============================== LOOP ============================== */
let lastT=performance.now(),acc=0,secAcc=0,saveAcc=0;
function logicStep(dt){
  if(cpsCache>0){state.pollen+=cpsCache*dt;state.life+=cpsCache*dt;state.allTime+=cpsCache*dt;}
  const fl=plvl('flap');
  if(fl>0){const g=clickCache*fl*dt;state.pollen+=g;state.life+=g;state.allTime+=g;state.autoPoll+=g;}
  recalc();
  updateHeader();
}
function secondStep(){
  state.play++;
  expireBuffs();
  goldenStep();
  checkAchievements();
  renderBuffs();
  updateTowerRows();
  refreshUpgrades();
  if(curTab==='rebirth'){updateRebirth();updatePerkStates();}
  if(curTab==='stats')renderStats();
  document.title=fmt(Math.floor(state.pollen))+' pollen - Bee Swarm Clicker';
}
function loop(now){
  const dt=Math.min(.25,(now-lastT)/1000);lastT=now;
  acc+=dt;secAcc+=dt;saveAcc+=dt;
  while(acc>=.1){logicStep(.1);acc-=.1;}
  swarmTick(dt);
  if(secAcc>=1){secAcc-=1;secondStep();}
  if(saveAcc>=30){saveGame(false);saveAcc=0;}
  requestAnimationFrame(loop);
}

/* ============================== TABS & EVENTS ============================== */
let curTab='bees';
function switchTab(name){
  curTab=name;
  document.querySelectorAll('#tabs button').forEach(b=>b.classList.toggle('active',b.dataset.tab===name));
  document.querySelectorAll('.view').forEach(v=>v.classList.toggle('on',v.id==='view-'+name));
  if(name==='rebirth'){updateRebirth();updatePerkStates();}
  if(name==='stats')renderStats();
  if(name==='bees')updateTowerRows();
  if(name==='upgrades')refreshUpgrades();
  hideTip();
}
function setupEvents(){
  document.querySelectorAll('#tabs button').forEach(b=>b.addEventListener('click',()=>switchTab(b.dataset.tab)));
  document.querySelectorAll('#buyAmtSeg button').forEach(b=>b.addEventListener('click',()=>{
    state.buyAmt=+b.dataset.amt;applySettingsUI();updateTowerRows();saveGame(false);
  }));
  const sb=document.querySelector('#sellSeg button');
  if(sb)sb.addEventListener('click',()=>{state.sell=!state.sell;applySettingsUI();updateTowerRows();saveGame(false);});
  $('flowerWrap').addEventListener('pointerdown',clickFlower);
  bindTips($('towerList'),'data-i',i=>towerTip(+i));
  bindTips($('upgradeGrid'),'data-up',upgradeTip);
  bindTips($('achGrid'),'data-ach',achTip);
  bindTips($('rebirthArea'),'data-perk',perkTip);
  window.addEventListener('beforeunload',()=>{saveGame(false);});
  document.addEventListener('visibilitychange',()=>{if(document.hidden)saveGame(false);});
}
function rebuildAll(){
  buildTowerRows();
  updateTowerRows();
  refreshUpgrades(true);
  buildRebirthView();
  renderAchGrid();
  refreshAchMeta();
  renderStats();
  applySettingsUI();
  recalc(true);
}

/* ============================== INIT ============================== */
function init(){
  ACHS=buildAchs();
  buildUpgradeData();
  loadGame();
  achCount=achCountFn();
  honeyPct=ACHS.length?achCount/ACHS.length*100:0;
  offlineGains();
  buildDecor();
  renderOptions();
  rebuildAll();
  setupEvents();
  scheduleGolden(true);
  recalc(true);
  updateHeader();
  renderBuffs();
  setInterval(tickerTick,12000);
  requestAnimationFrame(t=>{lastT=t;requestAnimationFrame(loop);});
}

// --- OVERRIDE: freshState — add gifted[] + hiveSkins{} + tokenThreshold ---
function freshState(){
  return {
    v:1, pollen:0, life:0, allTime:0, hand:0, autoPoll:0, clicks:0,
    towers:new Array(NT).fill(0), up:{}, ach:{}, upBought:0,
    rebirths:0, tokens:0, tokEarn:0, tokSpent:0, perks:{},
    gold:0, buffs:[],
    started:Date.now(), play:0, last:Date.now(),
    buyAmt:1, sell:false, muted:false, fancy:true,
    gifted:new Array(NT).fill(0),
    hiveSkins:{owned:['default'], active:'default'},
    tokenThreshold:1e9   // v3.3: next pollen threshold to cross for +1 token (persists across rebirths, scales 2.5x per token)
  };
}

// --- OVERRIDE: adoptState — load new fields safely ---
function adoptState(raw){
  const s=freshState();
  try{
    const o=JSON.parse(raw);
    if(!o||typeof o!=='object')return false;
    s.pollen=numSafe(o.pollen,0);
    s.life=numSafe(o.life,0);
    s.allTime=numSafe(o.allTime,0);
    s.hand=numSafe(o.hand,0);
    s.autoPoll=numSafe(o.autoPoll,0);
    s.clicks=numSafe(o.clicks,0);
    if(Array.isArray(o.towers)){for(let i=0;i<NT;i++)s.towers[i]=Math.max(0,Math.floor(numSafe(o.towers[i],0)));}
    if(o.up&&typeof o.up==='object')s.up=o.up;
    if(o.ach&&typeof o.ach==='object')s.ach=o.ach;
    s.upBought=numSafe(o.upBought,0);
    s.rebirths=Math.floor(numSafe(o.rebirths,0));
    s.tokens=Math.floor(numSafe(o.tokens,0));
    s.tokEarn=Math.floor(numSafe(o.tokEarn,0));
    s.tokSpent=Math.floor(numSafe(o.tokSpent,0));
    if(o.perks&&typeof o.perks==='object')s.perks=o.perks;
    s.gold=numSafe(o.gold,0);
    if(Array.isArray(o.buffs))s.buffs=o.buffs.filter(b=>b&&b.id&&isFinite(b.until));
    s.started=numSafe(o.started,Date.now());
    s.play=numSafe(o.play,0);
    s.last=numSafe(o.last,Date.now());
    s.buyAmt=[0,1,10,100].includes(o.buyAmt)?o.buyAmt:1;   // v3.3: allow 0 (Max)
    s.sell=!!o.sell; s.muted=!!o.muted; s.fancy=o.fancy!==false;
    if(Array.isArray(o.gifted)){for(let i=0;i<NT;i++)s.gifted[i]=o.gifted[i]?1:0;}
    if(o.hiveSkins&&typeof o.hiveSkins==='object'){
      if(Array.isArray(o.hiveSkins.owned))s.hiveSkins.owned=o.hiveSkins.owned.filter(x=>typeof x==='string');
      if(typeof o.hiveSkins.active==='string')s.hiveSkins.active=o.hiveSkins.active;
      if(!s.hiveSkins.owned.includes('default'))s.hiveSkins.owned.unshift('default');
      if(!s.hiveSkins.owned.includes(s.hiveSkins.active))s.hiveSkins.active='default';
    }
    // v3.3: load token threshold (the "highest goal reached" that persists across rebirths)
    s.tokenThreshold=Math.max(1e9,numSafe(o.tokenThreshold,1e9));
    state=s; return true;
  }catch(e){return false;}
}

// --- OVERRIDE: towerCps — apply gifted boost per-bee ---
function towerCps(i){
  const base=TOWERS[i].cps*Math.pow(2,towerUpCount(i))*state.towers[i];
  return base*(state.gifted[i]?(1+GIFTED_BOOST[i]):1);
}

// --- NEW: synergyMult(kind) — multiplier for 'all' | 'cps' | 'click' ---
function synergyMult(kind){
  let m=1;
  for(const s of SYN_BEES){
    if(s.kind!==kind)continue;
    const stacks=Math.floor(state.towers[s.idx]/s.per);
    if(stacks>0)m*=1+s.v*stacks;
  }
  return m;
}
function synergyFor(idx){return SYN_BEES.find(s=>s.idx===idx);}

// --- OVERRIDE: recalc — apply synergy multipliers ---
function recalc(force){
  let sum=0;
  for(let i=0;i<NT;i++)sum+=towerCps(i);
  const gm=(1+.25*plvl('motor'))*(1+plvl('bless'))*(1+.005*achCount)*(1+honeyPct*synRateSum())*buffMult(false);
  const synAll=synergyMult('all');
  const synCps=synergyMult('cps');
  cpsCache=sum*gm*synAll*synCps;
  const share=cpsCache*cpsShareSum();
  const synClick=synergyMult('click');
  clickCache=(Math.pow(2,clickMultUpCount())+share)*Math.pow(2,plvl('sting'))*buffMult(true)*synAll*synClick;
  if(force)updateHeader();
}

// --- OVERRIDE: clickPowerBase — apply synergy ---
function clickPowerBase(){
  let sum=0;for(let i=0;i<NT;i++)sum+=towerCps(i);
  const gm=(1+.25*plvl('motor'))*(1+plvl('bless'))*(1+.005*achCount)*(1+honeyPct*synRateSum());
  const cps=sum*gm*synergyMult('all')*synergyMult('cps');
  return (Math.pow(2,clickMultUpCount())+cps*cpsShareSum())*Math.pow(2,plvl('sting'))*synergyMult('all')*synergyMult('click');
}

// --- OVERRIDE: swarmTick — velocity-based facing (no flying backwards) ---
// Bee webp sprites face LEFT by default (head pointing left, body to the right).
// We flip with scaleX(-1) when the bee is moving RIGHT, so the head always leads.
function swarmTick(dt){
  if(!swarm.length)return;
  const scene=$('gardenScene');if(!scene)return;
  const w=scene.clientWidth,h=scene.clientHeight,cx=w*.5,cy=h*.46;
  const t=performance.now()/1000;
  for(const b of swarm){
    b.retarget-=dt;
    if(b.retarget<=0){
      b.retarget=1.4+Math.random()*2.6;
      b.ang+=(Math.random()-.5)*1.8;
      b.rad=Math.max(.1,Math.min(.42,b.rad+(Math.random()-.5)*.2));
      if(Math.random()<.18)b.dir=-b.dir;
    }
    b.ang+=b.spin*b.dir*dt;
    const wob=1+.25*Math.sin(t*1.35+b.ph*2.3);
    const tx=cx+Math.cos(b.ang)*w*b.rad*wob;
    const ty=cy+Math.sin(b.ang)*h*b.rad*wob*.66+Math.sin(t*2.2+b.ph)*8;
    const k=Math.min(1,dt*b.spd);
    const dx=tx-b.x;
    b.x+=dx*k;b.y+=(ty-b.y)*k;
    b.x+=Math.cos(t*1.1+b.ph)*dt*8;b.y+=Math.sin(t*1.45+b.ph*1.3)*dt*8;
    // Flip horizontally based on actual movement direction (with small hysteresis to avoid jitter)
    // Image faces RIGHT by default, so moving right (dx>0) keeps scaleX(1), moving left flips to scaleX(-1).
    if(Math.abs(dx)>0.4) b.face=(dx>0)?1:-1;
    b.el.style.transform='translate('+(b.x-b.half)+'px,'+(b.y-b.half)+'px) scaleX('+b.face+')';
  }
}

  if(i===0)html+=`<div class="tpLine">More Basic Bees make your <b>taps</b> feel mightier.</div>`;
  const nextTier=TIER_THRESH.findIndex((th,k)=>!state.up['u_t'+i+'_'+k]);
  if(nextTier>=0)html+=`<div class="tpLine">Next upgrade at <b>${TIER_THRESH[nextTier]}</b> owned.</div>`;
  // v3.2: synergy + gifted info only shown AFTER the bee has been gifted
  if(state.gifted[i]){
    const syn=synergyFor(i);
    if(syn){
      const stacks=Math.floor(state.towers[i]/syn.per);
      html+=`<div class="tpLine"><b style="color:#ffd166">${syn.syn}</b> (Gifted ability) — ${syn.desc}. <span style="color:#9ccc65">${stacks} active.</span></div>`;
    }
    html+=`<div class="tpLine"><b style="color:#ffd166">Gifted</b> — permanently +${Math.round(GIFTED_BOOST[i]*100)}% production from ${t.name}s.</div>`;
  } else {
    html+=`<div class="tpLine" style="opacity:.7">Gift this bee (cost: ${GIFTED_COSTS[i]} tokens) to unlock its synergy ability.</div>`;
  }
  html+=`<div class="tpFlav">${t.flav}</div>`;
  return html;
}

// --- OVERRIDE: renderBuffs — only update time text, don't recreate elements (no re-animation) ---
function renderBuffs(){
  const bar=$('buffBar');if(!bar)return;
  const n=Date.now();
  const activeIds=new Set();
  for(const b of state.buffs){
    activeIds.add(b.id);
    let el=bar.querySelector('[data-buff="'+b.id+'"]');
    const left=Math.max(0,(b.until-n)/1000);
    if(!el){
      // New buff — create element ONCE (with buffIn animation)
      el=document.createElement('div');
      el.className='buff'+(b.id==='cosmic'?' cosmic':'');
      el.dataset.buff=b.id;
      el.innerHTML='<div class="bName">'+b.name+(b.mult?' x'+b.mult:'')+'</div><div class="bTime">'+left.toFixed(0)+'s remaining</div>';
      bar.appendChild(el);
    } else {
      // Existing buff — just update the time text (no re-animation)
      const timeEl=el.querySelector('.bTime');
      if(timeEl) timeEl.textContent=left.toFixed(0)+'s remaining';
    }
  }
  // Remove elements for buffs that have expired
  bar.querySelectorAll('[data-buff]').forEach(el=>{
    if(!activeIds.has(el.dataset.buff)) el.remove();
  });
}

// --- OVERRIDE: synergyMult — gate stacks by gifted state ---
function synergyMult(kind){
  let m=1;
  for(const s of SYN_BEES){
    if(s.kind!==kind)continue;
    // v3.2: synergy only activates if this bee type has been Gifted
    if(!state.gifted[s.idx])continue;
    const stacks=Math.floor(state.towers[s.idx]/s.per);
    if(stacks>0)m*=1+s.v*stacks;
  }
  return m;
}

// --- OVERRIDE: toast — only show achievement toasts (filter out upgrade/perk/gifted/skin/error toasts) ---
function toast(title,body,icon,ach){
  if(!ach)return;  // v3.2: only achievement notifications get shown
  const box=$('toasts');
  if(box.children.length>5)box.removeChild(box.firstChild);
  const el=document.createElement('div');
  el.className='toast'+(ach?' ach':'');
  el.innerHTML=`<div class="tIco">${ico(icon||'hex',34)}</div><div><div class="tTitle">${title}</div><div class="tBody">${body}</div></div>`;
  box.appendChild(el);
  setTimeout(()=>{el.classList.add('out');setTimeout(()=>{if(el.parentNode)el.parentNode.removeChild(el);},320);},4200);
}

/* ============================================================================
   BEE-GAME v3.3 PATCHES (round 4)
   - Max buy button (buyAmt=0 means "buy max affordable")
   - Token threshold rebirth system (persists across rebirths, scales 2.5x per token earned)
   ============================================================================ */

// --- NEW: maxAffordable(i) — solve geometric series for n where cost <= pollen ---
function maxAffordable(i){
  const o=state.towers[i];
  const base=TOWERS[i].base*Math.pow(1.15,o)*disc();
  if(state.pollen<base)return 0;
  const n=Math.floor(Math.log(1+0.15*state.pollen/base)/Math.log(1.15));
  return Math.max(0,n);
}

// --- OVERRIDE: costOf — handle n=0 (means max affordable) ---
function costOf(i,n){
  if(n===0)n=maxAffordable(i);
  const o=state.towers[i];
  return TOWERS[i].base*Math.pow(1.15,o)*(Math.pow(1.15,n)-1)/0.15*disc();
}

// --- OVERRIDE: refundOf — handle n=0 (means sell all) ---
function refundOf(i,n){
  const o=state.towers[i];
  if(n===0)n=o;
  return 0.25*TOWERS[i].base*Math.pow(1.15,o-n)*(Math.pow(1.15,n)-1)/0.15*disc();
}

// --- OVERRIDE: buyTower — handle buyAmt=0 (Max) in both buy and sell modes ---
function buyTower(i){
  if(state.sell){
    const o=state.towers[i];if(o<=0)return;
    const n=state.buyAmt===0?o:Math.min(o,state.buyAmt);
    state.towers[i]-=n;
    gainPollen(refundOf(i,n),false,false);
    if(state.towers[i]===0)swarmDespawn(i);
    sfx('click');
  }else{
    let n=state.buyAmt;
    if(n===0)n=maxAffordable(i);
    if(n<=0){sfx('err');return;}
    const c=costOf(i,n);
    if(state.pollen<c){sfx('err');return;}
    state.pollen-=c;state.towers[i]+=n;
    swarmSpawn(i,true);
    sfx('buy');
  }
  updateTowerRows();
  refreshUpgrades();
  updateHeader();
}

// --- OVERRIDE: updateTowerRows — handle buyAmt=0 (Max) display ---
function updateTowerRows(){
  let total=0;for(let i=0;i<NT;i++)total+=towerCps(i);
  for(let i=0;i<NT;i++){
    const r=rowEls[i];if(!r)continue;
    const vis=towerVisible(i);
    r.row.classList.toggle('locked',!vis);
    if(!vis)continue;
    const o=state.towers[i];
    r.owned.textContent=o>0?'x '+fmtInt(o):'';
    const each=TOWERS[i].cps*Math.pow(2,towerUpCount(i));
    const tot=each*o;
    r.sub.textContent='each: '+fmt(each)+'/s'+(o>0?' — total: '+fmt(tot)+'/s':'');
    if(state.sell){
      if(o<=0){r.price.textContent='none';r.price.className='price';r.row.classList.add('cant');r.row.classList.remove('canBuy','sellMode');}
      else{
        const n=state.buyAmt===0?o:Math.min(o,state.buyAmt);
        r.price.textContent='+'+fmt(refundOf(i,n));
        r.price.className='price sell';
        r.row.classList.remove('cant','canBuy');r.row.classList.add('sellMode');
        r.pct.textContent='sell '+(state.buyAmt===0?'all':n);
      }
    }else{
      const isMax=state.buyAmt===0;
      const n=isMax?maxAffordable(i):state.buyAmt;
      const c=costOf(i,n);
      r.price.textContent=fmt(c)+(isMax&&n>0?(' ('+n+')'):(isMax?' (0)':''));
      const ok=state.pollen>=c&&n>0;
      r.price.className='price'+(ok?' ok':'');
      r.row.classList.toggle('cant',!ok);
      r.row.classList.toggle('canBuy',ok);
      r.row.classList.remove('sellMode');
      r.pct.innerHTML=total>0&&tot>0?('+'+trimNum(tot/total*100,1)+'% of pollen'):'&nbsp;';
    }
  }
}
// Re-apply the post-update hooks (gift badges + synergy lines + open info panels)
// since we just replaced updateTowerRows. The const-assignment overrides the function decl above.
const _v33_origUTR=updateTowerRows;
updateTowerRows=function(){
  _v33_origUTR();
  updateGiftBadges();
  updateSynergyLines();
  refreshOpenInfoPanels();
};

// --- OVERRIDE: rebirthNeed — return the persistent token threshold (next goal to cross) ---
function rebirthNeed(){
  return state.tokenThreshold;
}

// --- OVERRIDE: rebirthEarn — count thresholds crossed this run (each = 1 token) ---
function rebirthEarn(){
  let count=0;
  let threshold=state.tokenThreshold;
  let life=state.life;
  while(life>=threshold){
    count++;
    life-=threshold;
    threshold*=2.5;
  }
  return count;
}

// --- OVERRIDE: confirmRebirth — advance tokenThreshold by 2.5^earn (persists across rebirths) ---
function confirmRebirth(){
  const need=rebirthNeed(),earn=rebirthEarn();
  if(state.life<need||earn<=0)return;
  // v3.3: advance tokenThreshold by 2.5^earn — this is the "save the number" behavior
  state.tokenThreshold=state.tokenThreshold*Math.pow(2.5,earn);
  state.rebirths++;state.tokens+=earn;state.tokEarn+=earn;
  state.pollen=HEADSTART[plvl('head')];state.life=0;
  state.towers=new Array(NT).fill(0);
  state.up={};state.upBought=0;state.buffs=[];
  removeGolden();endStorm();
  rebuildAll();swarmInit();recalc(true);saveGame(true);
  sfx('rebirth');
  openModal(`<h3>Reborn!</h3><div class="mBody">The hive hums with new energy.<br><br>You received <b>${earn} rebirth token${earn===1?'':'s'}</b>.<br>The next token threshold is now <b>${fmt(state.tokenThreshold)}</b> pollen — it persists across rebirths.<br><br>Spend tokens in the <b>Rebirth Shop</b> below for permanent powers - or save up for something big.</div><div class="btnRow"><button class="btn purple" onclick="closeModal()">Begin again</button></div>`);
}

  $('rebirthArea').innerHTML=`

  </div>

// --- OVERRIDE: updateRebirth — show threshold progress + earned tokens ---
function updateRebirth(){
  const need=rebirthNeed(),earn=rebirthEarn(),ready=state.life>=need&&earn>0;
  $('rebN').textContent=state.rebirths;
  $('rebLife').textContent=fmt(state.life);
  $('rebNeed').textContent=fmt(need);
  $('rebFill').style.width=Math.min(100,state.life/need*100)+'%';
  $('rebEarnLine').innerHTML=ready
    ?`Rebirthing now grants <b>${earn} token${earn===1?'':'s'}</b>. Crossing more thresholds before rebirthing earns more!`
    :`Reach <b>${fmt(need)}</b> pollen this run to earn <b>1 token</b>.`;
  $('rebBtn').disabled=!ready;
  $('tokLbl').innerHTML=state.tokens+' tokens';
  const t2=$('tokLbl2');if(t2)t2.innerHTML=state.tokens+' tokens available';
  const sl=$('skinLbl');if(sl)sl.textContent=state.hiveSkins.owned.length+' / '+HIVE_SKINS.length+' owned';
}
